<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/console/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e2553f" />
    <title>InterPay - Merchant</title>

    <!-- PWA: installable, standalone, app icon. -->
    <link rel="manifest" href="/console/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/console/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="InterPay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Set the theme before first paint so there is no light→dark flash. Saved choice wins,
         otherwise follow the system. Kept inline and tiny on purpose. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('interpay.theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
