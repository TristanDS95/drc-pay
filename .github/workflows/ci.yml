name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Type-check (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest

  console:
    name: Console (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json
      # `npm ci` (not `install`): installs exactly the lockfile, so CI can't drift from
      # what a developer has locally.
      - name: Install
        run: npm ci
      - name: Type-check (svelte-check + tsc)
        run: npm run check
      # The console compiles, so a bad import or a syntax error is invisible until something
      # builds it. Once the deploy image builds it too, that "something" would be the deploy.
      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the real deploy image, including the Node stage that compiles the console.
      # This is what stops a broken Dockerfile from being discovered by Railway in production.
      - name: Build the deploy image
        run: docker build -t drc-pay:ci .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tgz
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --redact -v

  # mobile job — add when the mobile app exists (see docs/future-dev.md): lint + type-check + EAS build.
